name: DiscordMusicPanel
version: '1.0.0'
main: dev.musicpanel.MusicPanelPlugin
api-version: '1.21.11'
description: Discord music bot (YouTube + Spotify) with a button control panel, running inside Paper.
authors: [DiscordMusicPanel]

commands:
  musicpanel:
    description: Manage the Discord music bot
    usage: /<command> <status|reload|stop>
    aliases: [mpanel]
    permission: musicpanel.admin

permissions:
  musicpanel.admin:
    description: Manage the Discord music bot from in-game / console
    default: op
